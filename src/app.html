<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
		<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<meta name="theme-color" content="#0a0a0b" />
		<!-- Warm the LCP hero backdrop (first carousel slide, painted as a CSS background). -->
		<link rel="preload" as="image" href="/bg1.webp" type="image/webp" fetchpriority="high" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			const GA_ID = 'G-Y7LRYPXB3N';
			window.dataLayer = window.dataLayer || [];
			window.gtag = function gtag() {
				window.dataLayer.push(arguments);
			};

			function loadGtag() {
				const script = document.createElement('script');
				script.async = true;
				script.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
				document.head.appendChild(script);
				window.gtag('js', new Date());
				window.gtag('config', GA_ID);
			}

			function scheduleGtag() {
				const run = () => {
					if ('requestIdleCallback' in window) {
						window.requestIdleCallback(loadGtag, { timeout: 3000 });
					} else {
						window.setTimeout(loadGtag, 1600);
					}
				};

				if (document.readyState === 'complete') run();
				else window.addEventListener('load', run, { once: true });
			}

			scheduleGtag();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
